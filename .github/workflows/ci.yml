name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci

      # Correctness first: a formatting nit must not mask a broken build or a
      # failing test, which is exactly what hid the Windows results once.
      - run: npm run build
      - run: npm test
      - run: npm run typecheck

      # Style gates last, and each still runs even if an earlier one failed, so
      # one red run reports every problem instead of only the first.
      - run: npm run lint
        if: '!cancelled()'
      - run: npm run fmt:check
        if: '!cancelled()'
      - run: npm run check:package
        if: '!cancelled()'
